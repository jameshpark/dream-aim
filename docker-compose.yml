version: '3.8'

# PostgreSQL database for Dream AIM application
# To connect from the application running outside Docker, use:
# DATABASE_URL=postgresql://postgres:postgres@localhost/dreamaim

services:
  db:
    image: postgres:14
    container_name: dreamaim-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dreamaim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dreamaim-network

volumes:
  postgres_data:
    name: dreamaim-postgres-data

networks:
  dreamaim-network:
    name: dreamaim-network
